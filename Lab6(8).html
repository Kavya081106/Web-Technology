<html>
<body>

<h1 id="head" onmouseover="this.style.color='yellow'" onmouseout="this.style.color='black'">Hover over me</h1>

<button onclick="document.body.style.background='red'">Red</button>
<button onclick="document.body.style.background='green'">Green</button>

function showTime() {
  document.getElementById("time").innerText = new Date();
}
</script>
