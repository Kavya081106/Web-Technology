<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        n1 = parseInt(prompt("Enter number 1"))
        n2 = parseInt(prompt("Enter number 2"))
        for (i = n1; i <= n2; i++) {
            count = 0;
            for (j = 2; j <= i/2; j++) {
                if (i % j == 0) {
                    count++;
                    break;
                }
            }
            if (count == 0) {
                document.write(i + "<br/>")
            }
        }
    </script>
</body>

</html>
