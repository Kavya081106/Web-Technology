<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        arr = [1,2,3,4,5]
        arr.push(6) //adds at end
        arr.pop() //removes from end
        arr.shift()//removes from first
        arr.unshift("hello")//adds at first
        arr.splice(2,3,"hello", "hi")//index,length
        store = arr.slice(1,2)//start,end
        arr1=[2,3,1,5,4]
        arr1.sort()
        document.write(arr1+"<br>")
        document.write(arr+"<br>" )
        document.write(store)
    </script>
</body>
</html>
