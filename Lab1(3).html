<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        number = parseInt(prompt("Enter number"))
        res=1
    for(i=number;i>=1;i--){
        res = res*i
    }

    document.write("Factorial of given number is "+res + "</br>")
    document.write("Factorial of given number is ",res +"</br>")
    document.write(`Factorial of given number is  ${res}`)
    </script>
</body>
</html>
