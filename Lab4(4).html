<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Cards</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  ></script>
</head>
<body>

<script>
  const products = [
    {
      id: 1,
      name: 'Laptop',
      description: 'A high performance laptop',
      price: 1200,
      category: 'Electronics',
      inStock: true
    },
    {
      id: 2,
      name: 'Smartphone',
      description: 'Latest model smartphone with advanced features',
      price: 800,
      category: 'Electronics',
      inStock: true
    },
    {
      id: 3,
      name: 'Desk Chair',
      description: 'Ergonomic desk chair for comfortable seating',
      price: 150,
      category: 'Furniture',
      inStock: false
    },
    {
      id: 4,
      name: 'Book',
      description: 'A popular science fiction novel',
      price: 20,
      category: 'Books',
      inStock: true
    },
    {
      id: 5,
      name: 'Headphones',
      description: 'Noise-cancelling over-ear headphones',
      price: 200,
      category: 'Electronics',
      inStock: true
    }
  ];

  document.write("<div class='container mt-5'>");
  document.write("<div class='row'>");

  for (let i = 0; i < products.length; i++) {
    const product = products[i];

    document.write("<div class='col-md-6 col-lg-4 mb-4'>");
    document.write("<div class='card' style='width: 100%;'>");
    document.write("<img src='https://www.pexels.com/photo/blue-headphone-1037992/' class='card-img-top' alt='" + product.name + "'>");
    document.write("<div class='card-body'>");
    document.write("<h5 class='card-title'>" + product.name + "</h5>");
    document.write("<p class='card-text'>" + product.description + "</p>");
    document.write("<p class='card-text'>Price: $" + product.price + "</p>");
    document.write("<p class='card-text'>Category: " + product.category + "</p>");
    document.write("<p class='card-text'>Stock: " + (product.inStock ? "In Stock" : "Out of Stock") + "</p>");
    document.write("<a href='#' class='btn btn-primary'>View Product</a>");
    document.write("</div>");
    document.write("</div>");
    document.write("</div>"); 
  }

  document.write("</div>"); // row
  document.write("</div>"); // container
</script>

</body>
</html>
