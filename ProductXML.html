<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Cards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <style>
    .card img {
      height: 200px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container mt-5">
    <div class="row" id="cardContainer">
     
    </div>
  </div>

  <script>
    const xhttp = new XMLHttpRequest();
    xhttp.open("GET", "https://68830d5a21fa24876a9c6b81.mockapi.io/Products", true);
    xhttp.send();

    xhttp.onload = function () {
      if (xhttp.status === 200) {
        const data = JSON.parse(this.responseText);
        let temp = '';

        data.forEach((product) => {
          temp += `
            <div class="col-md-4 mb-4">
              <div class="card h-100">
                <img src="${product.ProductImg}" class="card-img-top" alt="${product.ProductName}">
                <div class="card-body">
                  <h5 class="card-title">${product.ProductName}</h5>
                  <p class="card-text">Price: ₹${product.ProductPrice}</p>
                  <p class="card-text"><strong>Category:</strong> ${product.ProductCategory}</p>
                  <a href="#" class="btn btn-primary">View Details</a>
                </div>
              </div>
            </div>
          `;
        });

        document.getElementById("cardContainer").innerHTML = temp;
      } else {
        alert("Failed to load data.");
      }
    };
  </script>

</body>
</html>
