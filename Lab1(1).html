<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = parseInt(prompt("Enter number 1 :"))
        b = parseInt(prompt("Enter number 2:"));
        op = prompt("Enter operator you want to perform (+ - * /)")
        if(op=='+'){
            document.write("Addition of two numbers is "+(a+b))
        }else if(op=='-'){
             document.write("Subtraction of two numbers is "+(a-b))
        }else if(op=='*'){
             document.write("Multiplication of two numbers is "+(a*b))
        }else if(op=='/'){
             document.write("Division of two numbers is "+(a-b))
        }
    </script>
</body>
</html>
