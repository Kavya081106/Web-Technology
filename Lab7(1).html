<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- WAP to demonstrate callbacks in JavaScript. -->
<body>
    <script>
        function sum(a,b,myCallback){
            sum = a+b;
            myCallback(sum);
        }

        function printAns(ans){
             document.write("Sum is ",ans);
        }

        sum(5,3,printAns);
    </script>
</body>
</html>
