<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        number = parseInt(prompt("Enter number"))
        for(i=1;i<=number;i++){
            if(number%i==0){
                document.write(i+"<br/>");
            }
        }
    </script>
</body>
</html>
