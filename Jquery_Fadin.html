<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
  $("button").click(function(){
    $("#div1").fadeIn();
    $("#div2").fadeIn("slow");
    $("#div3").fadeIn(2000);
    $("#div4").fadeIn("fast");
  });
});
</script>
<style>
 
#div1 {
  width:100px;
  height:100px;
  border: 2px solid yellow;
  display:none;
  background-color:red;
}
 
#div2 {
  width:100px;
  height:100px;
  border: 2px solid green;
  display:none;
  background-color:blue;
}
 
#div3 {
  width:100px;
  height:100px;
  border: 2px solid yellow;
  display:none;
  background-color:green;
}
 
#div4 {
  width:100px;
  height:100px;
  border: 2px solid blue;
  display:none;
  background-color:yellow;
}
 
</style>
</head>
<body>
 
<h1>Fade In</h1>
<p>Four divs will Fade In below on the click of button:</p>
<button>Fade In and Display Invisible Elements</button><br><br>
 
<div id="div1">Div1</div><br>
<div id="div2">Div2</div><br>
<div id="div3">Div3</div><br>
<div id="div4">Div4</div><br>
 
</body>
</html>
