<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        str = prompt("Enter sentence")
        str1 = str.split(" ");

       document.write(str1)

       n = prompt("Enter a word whose index is reqired")
    
       for(i=0;i<str.length;i++){
        if(n==str1[i]){
            document.write(i + "<br/>")
        }
       }
    </script>
</body>
</html>
