    <script>
         number = parseInt(prompt("Enter number"))
         power = 0
         temp = number
         digits = number.toString().length
         
         while(temp>0){
            digit = temp%10
            sum = Math.floor(pow(digit,digits))
            temp = Math.floor(temp/10)
         }

         if(number==sum){
            document.write("Number is armstrong")
         }else{
            document.write("Number is not armstrong")
         }

         
    </script>
