<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Black Themed Calculator</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    table {
      background-color: #111;
      border: 2px solid #fff;
      color: #fff;
      width: 280px;
    }

    input {
      width: 100%;
      height: 50px;
      font-size: 22px;
      background-color: #222;
      color: #0f0;
      border: none;
      text-align: right;
      padding: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      height: 50px;
      font-size: 20px;
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }

    td {
      padding: 0;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td colspan="4">
        <input type="text" id="input" readonly>
      </td>
    </tr>
    <tr>
      <td><button onclick="clearInput()">AC</button></td>
      <td><button onclick="backspace()">←</button></td>
      <td><button onclick="calculate()">=</button></td>
      <td><button onclick="displayElement(0)">0</button></td>
    </tr>
    <tr>
      <td><button onclick="displayElement(1)">1</button></td>
      <td><button onclick="displayElement(2)">2</button></td>
      <td><button onclick="displayElement(3)">3</button></td>
      <td><button onclick="displayElement('*')">*</button></td>
    </tr>
    <tr>
      <td><button onclick="displayElement(5)">5</button></td>
      <td><button onclick="displayElement(6)">6</button></td>
      <td><button onclick="displayElement(7)">7</button></td>
      <td><button onclick="displayElement('/')">/</button></td>
    </tr>
    <tr>
      <td><button onclick="displayElement(8)">8</button></td>
      <td><button onclick="displayElement(9)">9</button></td>
      <td><button onclick="displayElement('-')">-</button></td>
      <td><button onclick="displayElement('+')">+</button></td>
    </tr>
    <tr>
      <td><button onclick="displayElement('%')">%</button></td>
      <td><button onclick="displayElement('.')">.</button></td>
      <td><button onclick="displayElement('00')">00</button></td>
      <td><button disabled></button></td>
    </tr>
  </table>

  <script>
    function displayElement(num) {
      document.getElementById("input").value += num;
    }

    function clearInput() {
      document.getElementById("input").value = "";
    }

    function backspace() {
      let current = document.getElementById("input").value;
      document.getElementById("input").value = current.slice(0, -1);
    }

    function calculate() {
      try {
        let result = eval(document.getElementById("input").value);
        document.getElementById("input").value = result;
      } catch (e) {
        alert("Invalid Expression");
      }
    }
  </script>
</body>
</html>
