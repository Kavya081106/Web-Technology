<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort array in ascending</title>
</head>
<body>
    <script>
        size = parseInt(prompt("Enter size of array"))
        arr = [size]


        for (i = 0; i < size; i++) {
            arr[i] = parseInt(prompt("Enter number :"))
        }

        for(i=0;i<size;i++){    
            for(j=i+1;j<size;j++){

                 if(arr[i]> arr[j]){
                    temp = arr[i]
                    arr[i] = arr[j]
                    arr[j] = temp
                    
                }

            }
         }

            
            for(j=0;j<size;j++){
                document.write(arr[j]+"<br/>")
            }


          

         

         
          
    
    </script>
</body>
</html>
