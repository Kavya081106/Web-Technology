<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
</head>
<body>
  <p class="h1 text-primary m-5">Product Management</p>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" class="form-control" id="productName" placeholder="Product Name" />
        </div>
      </div>
      <div class="col">
        <div class="mb-3">
          <label class="form-label">Category</label>
          <input type="text" class="form-control" id="category" placeholder="Category" />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="mb-3">
          <label class="form-label">Price</label>
          <input type="number" class="form-control" id="price" placeholder="Price" />
        </div>
      </div>
      <div class="col">
        <div class="mb-3">
          <label class="form-label">Image URL</label>
          <input type="text" class="form-control" id="imageURL" placeholder="Image URL" />
        </div>
      </div>
    </div>
  </div>

  <button type="button" class="btn btn-primary m-5" onclick="addProduct()">Add Product</button>

  <div class="container">
    <div class="row" id="productContainer"></div>
  </div>

  <script>
    let products = [];

    function addProduct() {
      const productName = document.getElementById('productName').value;
      const category = document.getElementById('category').value;
      const price = document.getElementById('price').value;
      const imageURL = document.getElementById('imageURL').value;

      
      if (!productName || !category || !price || !imageURL) {
        alert("Please fill in all fields.");
        return;
      }

      
      const product = {
        productName: productName,
        category: category,
        price: price,
        imageURL: imageURL
      };

      
      products.push(product);

      
      document.getElementById('productName').value = '';
      document.getElementById('category').value = '';
      document.getElementById('price').value = '';
      document.getElementById('imageURL').value = '';

      
      displayProducts();
    }

    function displayProducts() {
      const container = document.getElementById('productContainer');
      container.innerHTML = '';

      products.forEach((prod, index) => {
        container.innerHTML += `
          <div class="col-md-4 mb-4">
            <div class="card h-100">
              <img src="${prod.imageURL}" class="card-img-top" alt="${prod.productName}">
              <div class="card-body">
                <h5 class="card-title">${prod.productName}</h5>
                <p class="card-text">Category: ${prod.category}</p>
                <p class="card-text">Price: ₹${prod.price}</p>
              </div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
