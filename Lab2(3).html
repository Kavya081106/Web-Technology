<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pattern</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter number"));
        
        for (let i = 1; i <= n; i++) {
            for (let j = 1; j <= i; j++) {
                document.write('*');
            }
            document.write('<br/>');
        }

       for (let i = n; i >= 1; i--) {
            for (let j = 1; j <= i; j++) {
                document.write(j);
            }
            document.write('<br/>');
        }


    </script>
</body>
</html>
