<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    number = parseInt(prompt("Enter number :"))
    x=0
    y=1
    sum=0
    for(i=x;i<=number;i++){
         
         document.write(x + " ");   //x=0 x=1
            sum = x + y;            //sum=0+1=1 sum=2
            x = y;                  //x=1 x=1
            y = sum;                //y=1 y=2
        
    }
    </script>
</body>
</html>
